[project]
name = "rules-vs-llms"
version = "0.1.0"
description = "Fire AI Take-Home: Rules vs LLMs"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pytest>=7.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "tiktoken>=0.5",
    "scikit-learn>=1.3",
    "rapidfuzz>=3.0",
    "pyarrow>=14.0",

]

[tool.pytest.ini_options]
testpaths = ["project_a/tests", "project_b/tests"]
pythonpath = ["."]
